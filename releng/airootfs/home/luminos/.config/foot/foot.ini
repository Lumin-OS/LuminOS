# LuminOS default terminal.
#
# foot rather than kitty/alacritty: it is Wayland-native (no XWayland round
# trip), it is the smallest of the three in the image, and its terminfo was
# already in this profile's package list.

font=JetBrainsMono Nerd Font:size=11
dpi-aware=no

# The live session has no scrollback persistence, so give it a generous buffer:
# installer output is the main thing anyone will want to scroll back through.
scrollback-lines=10000

[cursor]
style=beam
blink=yes

[colors]
# Tokyo Night, matching waybar and the Hyprland borders.
background=1a1b26
foreground=c0caf5
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5
