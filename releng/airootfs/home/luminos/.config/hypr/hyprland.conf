# LuminOS default Hyprland configuration.
#
# This is the session the live ISO boots into and the session an installed
# LuminOS gets by default. It is intentionally conservative: the live medium's
# job is to be usable enough to run the installer on unknown hardware, so
# anything that can fail on a weird GPU is either off or has a fallback.
#
# Launched from ~/.zprofile on tty1 (live) — see the LuminOS archiso profile.

################################## Monitors ###################################

# Preferred mode, auto position, no scaling. 'preferred' rather than a hard
# resolution because this config ships to unknown hardware and to VMs whose
# virtual display is whatever the host window was sized to.
monitor = , preferred, auto, 1

################################### Autostart #################################

# Order matters. The portal needs the compositor up before it can advertise
# itself, and hyprpolkitagent has to be running before anything asks for
# privilege escalation, which on this medium means before the installer starts.

# dbus/systemd need the Wayland session variables to hand to user services that
# start later (portals, the polkit agent). Without this, xdg-desktop-portal
# starts with an empty WAYLAND_DISPLAY and screenshots/file dialogs silently
# fail.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

# polkit agent — without this, nothing graphical can escalate privileges.
exec-once = systemctl --user start hyprpolkitagent

exec-once = waybar
exec-once = mako

# No hyprpaper here on purpose. hyprpaper requires a wallpaper file to load and
# exits with an error if it has none, and LuminOS has no wallpaper art yet. The
# background is set with misc:background_color below instead, which is one fewer
# process and cannot fail. When there is real art, add a hyprpaper.conf and put
# `exec-once = hyprpaper` back.

# Network applet, so joining wifi before installing is a click and not a
# nmcli invocation.
exec-once = nm-applet --indicator

##################################### Env #####################################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,gtk3

################################### Look ######################################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6

    # Blur is the single most expensive thing a compositor can do and this image
    # boots on software rendering more often than not. Off by default; an
    # installed system can turn it on.
    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    # Kept on but short. Fully disabling animations makes the session feel
    # broken; long ones are unusable under llvmpipe.
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 3, easeOutQuint
    animation = fade, 1, 3, easeOutQuint
    animation = workspaces, 1, 3, easeOutQuint
}

dwindle {
    # NOTE: no 'pseudotile' here. That option was removed from the dwindle
    # layout in Hyprland 0.5x; the SUPER+P 'pseudo' dispatcher still works and
    # is what actually toggles it per-window.
    preserve_split = true
}

misc {
    # No "support Hyprland" wallpaper/logo on a distro's default session.
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    # Keep the session alive when the last window closes. On a live medium,
    # closing the terminal should not look like a crash.
    close_special_on_empty = true

    # The desktop background, in lieu of a wallpaper daemon. A deliberately
    # non-black colour: on a live ISO, "black screen" and "session running with
    # nothing open" are the two states a tester most needs to tell apart, and a
    # black root window makes a working session look like a boot failure.
    background_color = 0x1a1b26
}

################################### Input #####################################

input {
    # Empty = X11/Wayland default (us). The installer is responsible for setting
    # the real layout on the target; for the live session the user can change it
    # with hyprctl. Deliberately not hard-coding a non-US layout here, because
    # getting locked out of your own keyboard on an installer medium is worse
    # than typing on the wrong layout.
    kb_layout =
    kb_variant =
    kb_options =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Touchpad gestures. Hyprland 0.5x replaced the old `gestures { workspace_swipe
# = true }` block with this per-gesture keyword form.
gesture = 3, horizontal, workspace

################################## Keybinds ###################################

$mod = SUPER
$terminal = foot
$menu = rofi -show drun
$fileManager = thunar

# The essentials. These are also the acceptance criteria for "the live session
# is usable": a terminal, a launcher, and a way out.
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,

# A terminal on a second, very obvious binding too. If SUPER is swallowed by the
# hypervisor (VirtualBox and some VNC clients grab it), SUPER+Return never
# arrives and the session looks dead despite being fine. CTRL+ALT+T always
# reaches the compositor.
bind = CTRL ALT, T, exec, $terminal

bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, S, layoutmsg, togglesplit
bind = $mod, F, fullscreen,

# Focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots. Also how QA captures evidence that the session came up.
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# Media / hardware keys — bindl so they work even with the session locked.
bindl = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute,         exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute,      exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

################################# Window rules ################################

# INTENTIONALLY EMPTY on Hyprland 0.56.
#
# Hyprland replaced the window-rule engine (Desktop::Rule::CWindowRule) and the
# config grammar changed underneath it. The old form this config shipped,
#
#     windowrulev2 = float, class:^(pavucontrol)$
#
# now fails two ways at once: `windowrulev2` is rejected outright, and under
# plain `windowrule` the parser wants space-separated `field value` pairs
# instead of `field:value`. Verified against 0.56.2 with `--verify-config`:
#
#     windowrule = float true            -> parses
#     windowrule = float true, class foo -> "invalid field type class"
#
# so the effect syntax is settled but the MATCHER keyword is not `class` any
# more, and it is not discoverable from the shipped package (no example config,
# identifiers are not in the binary's strings).
#
# Rather than guess, the rules are removed. Guessing costs more than it buys
# here: `windowrule = float true` on its own parses cleanly and would apply to
# EVERY window, which is materially worse than having no rule at all. A live
# installer medium that floats every window is a broken-looking desktop.
#
# What was removed, to restore once the 0.56 matcher syntax is confirmed from
# upstream docs:
#   - suppressevent maximize for all windows
#   - float + center + size 900x650 for the installer (dawn / calamares)
#   - float + center for nm-connection-editor and pavucontrol
#   - nofocus for empty-class XWayland windows
#
# None of these are required for the session to work. They are polish, and the
# red config-error banner they were producing on every boot is worse polish
# than their absence. Tracked for follow-up.
