#
# LuminOS live-system /etc/pacman.conf
#
# This is the config the RUNNING LIVE SYSTEM uses. It is deliberately different
# from the build-time one (../../../pacman.conf, i.e. releng/pacman.conf):
#
#   releng/pacman.conf  -> pinned to a frozen Arch Linux Archive snapshot, so
#                          the IMAGE is reproducible.
#   this file           -> ordinary live mirrors, because the installer running
#                          from this medium is installing a system the user
#                          expects to be current, and because the archive is
#                          far too slow to pacstrap a real machine through.
#
# "Live vs installed divergence": pinning is a property of how we build the
# ISO, not a property of what the user ends up running.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
DisableDownloadTimeout

# Colour is worth it here: this is a terminal a human is going to be reading
# while an install runs.
Color
CheckSpace
VerbosePkgLists

# Do not weaken these. 'Required DatabaseOptional' means every package must
# carry a valid signature from a key in the trusted keyring. The keyring is
# initialised at boot by pacman-init.service, which runs
# `pacman-key --init && pacman-key --populate` and therefore picks up every
# keyring package installed in the image.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES
#
# /etc/pacman.d/mirrorlist is managed at runtime by reflector.service and by
# the `choose-mirror` kernel-cmdline hook, so it is Included rather than having
# servers hard-coded here.

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# -----------------------------------------------------------------------------
# LuminOS custom repository — DISABLED, and it must stay disabled until the
# packages in it are signed. See docs/REPOSITORY.md for the full write-up.
#
# Current state of Lumin-OS/luminos-repository:
#   - luminos-repository.db IS signed (key 070A4A036B2FE475, April 2024)
#   - the PACKAGES ARE NOT. There are no *.pkg.tar.zst.sig files and no
#     %PGPSIG% fields in the database entries.
#
# So with the SigLevel above, every package from it is rejected. The only way
# to make it work as-is would be `SigLevel = Optional TrustAll`, which turns
# off the check that stops a tampered mirror from installing arbitrary root
# code on a user's machine during their first install. We are not shipping
# that.
#
# To enable, all three must be true:
#   1. packages re-signed with a LuminOS repo key (repo-add -s signs only the
#      database; the packages need `gpg --detach-sign` each, or repo-add -v)
#   2. a `luminos-keyring` package installed in the image, dropping the public
#      key into /usr/share/pacman/keyrings/ so pacman-init.service trusts it
#   3. the Server line below pointing at real hosting
#
#[luminos-repository]
#SigLevel = Required DatabaseOptional
#Server = https://lumin-os.github.io/luminos-repository/$arch
# -----------------------------------------------------------------------------
