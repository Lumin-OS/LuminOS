#
# LuminOS build-time pacman.conf
#
# This file configures the pacman that mkarchiso uses to POPULATE THE IMAGE. It
# is not the pacman.conf the live system runs with — that one is
# airootfs/etc/pacman.conf, and it deliberately differs (see the note at the
# bottom of this file).
#
# See the pacman.conf(5) manpage for option and repository directives
#

#
# GENERAL OPTIONS
#
[options]
HoldPkg     = pacman glibc
Architecture = auto

# We cannot check disk space from within a chroot environment
#CheckSpace

# The Arch Linux Archive is a single host. Hammering it with parallel streams is
# both antisocial and unreliable, so the build serialises its downloads.
ParallelDownloads = 1

# Signature policy. Do not weaken these to make a build pass.
#
# 'Required DatabaseOptional' is what upstream archiso ships and what the
# archive serves correctly: every package is signed by an Arch packager, and the
# repo databases are signed too but pacman treats db signatures as optional
# because older mirrors did not carry them.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES
#
# PINNED. Every repo below points at one frozen daily snapshot of the Arch Linux
# Archive rather than at /etc/pacman.d/mirrorlist.
#
# Why: archiso's packages.x86_64 has no version syntax, so a mirrorlist Include
# makes the package closure whatever the mirror served that morning. That is
# precisely how this profile went from building in February 2024 to not
# resolving at all — six of its packages left the repos and nothing recorded
# which versions it had ever worked with.
#
# The snapshot date below MUST match ARCH_SNAPSHOT in ../pin.env. build.sh
# writes the same value into the builder container's own mirrorlist so that the
# build toolchain and the image contents come from the same frozen day.
#
# To move to a newer Arch: change ARCH_SNAPSHOT + SOURCE_DATE_EPOCH in pin.env,
# change the three Server lines here to match, re-run ./build.sh, re-verify boot.

[core]
Server = https://archive.archlinux.org/repos/2026/09/25/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/09/25/$repo/os/$arch

[multilib]
Server = https://archive.archlinux.org/repos/2026/09/25/$repo/os/$arch

# [luminos-repository] is intentionally ABSENT from this build-time config.
#
# Nothing in the current image comes from it — the Hyprland session is entirely
# official-repo packages — so including it would add a build failure mode for no
# benefit. More importantly it is not currently signed in a way pacman can
# verify: its database carries a signature but the packages inside it do not
# (no %PGPSIG% entries, no *.pkg.tar.zst.sig files), so any SigLevel that
# actually verifies packages rejects all of them, and the only way to make it
# work today would be `SigLevel = Optional TrustAll`, which is exactly the
# "signature verification disabled to make a build pass" that must never ship.
#
# The live system's config (airootfs/etc/pacman.conf) carries the repo entry
# commented out with the correct SigLevel and a pointer to the keyring work, so
# turning it on is a one-line change once the packages are signed.
# See docs/REPOSITORY.md.
